# RTL8125 (05:00.0) без кабеля заваливает журнал корректируемыми AER-ошибками:
# [12] Timeout / Data Link Layer / Transmitter ID, до ~10 тыс. подавленных за вспышку.
# Порт не используется. Blacklist только запрещает автозагрузку:
# при подключении кабеля драйвер поднимается вручную — modprobe r8169
blacklist r8169
