# RTL8125 (05:00.0): порт не используется (ноутбук работает по Wi-Fi).
#
# ВАЖНО: этот blacklist НЕ лечит AER-шторм. Проверено — ошибки идут с 0.8 с
# загрузки, ещё до загрузки любого драйвера, и продолжаются без r8169.
# Настоящее лечение — pcie_aspm=off (см. install.sh и README).
#
# Здесь blacklist оставлен только чтобы не поднимать неиспользуемый интерфейс.
# При подключении кабеля драйвер грузится вручную: modprobe r8169
blacklist r8169
