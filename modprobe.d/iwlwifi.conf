# AX211: прошивка падает на инициализации (NMI_INTERRUPT_UNKNOWN, Failed to start
# RT ucode -110, SecBoot CPU1 Status 0x8650). Баг живёт в 802.11ax Target Wake Time
# path — отключаем Wi-Fi 6, карта работает в 802.11ac. Источник: разбор AX211
# на discourse.ubuntu.com (тема про s2idle на Dell 7430), раздел «The static way».
options iwlwifi disable_11ax=1
# Энергосбережение: power_save уже выключен в NetworkManager, здесь — уровень iwlmvm.
options iwlwifi power_save=0
options iwlmvm power_scheme=1
