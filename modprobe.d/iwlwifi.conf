# Энергосбережение Wi-Fi: power_save выключен и в NetworkManager (см. conf.d),
# здесь — уровень iwlmvm. С энергосбережением iwlwifi даёт пинг 40-165 мс
# вместо 2-5 мс.
options iwlwifi power_save=0
options iwlmvm power_scheme=1

# ВАЖНО: disable_11ax=1 здесь НЕ нужен.
# Раньше считалось, что прошивка AX211 падает на инициализации 802.11ax
# (NMI_INTERRUPT_UNKNOWN, Failed to start RT ucode -110). Настоящая причина была
# в AER-шторме от проводного Realtek RTL8125, который дёргал весь чипсет.
# После pcie_aspm=off карта работает в Wi-Fi 6 без единого сбоя.
# Подробности — в README, раздел "The actual root cause".
